plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

def smokeSelection = providers.gradleProperty('smokeOnly').getOrElse('').trim()
def jadePickupRun = smokeSelection == 'jadepickupsave'
def alloyRun = smokeSelection == 'naturalalloyrepair'
def isolatedSmoke = jadePickupRun || alloyRun
def smokeRunId = isolatedSmoke ? UUID.randomUUID().toString() : ''
def smokeRunName = jadePickupRun ? 'jade-pickup' : 'natural-alloy'
def smokeGameDirectory = layout.projectDirectory.dir(isolatedSmoke ? "run/${smokeRunName}/${smokeRunId}" : 'run/smoke')
def smokeOutputDirectory = layout.buildDirectory.dir(isolatedSmoke ? "smoke/${smokeRunName}/${smokeRunId}" : 'smoke')


base {
    archivesName = mod_id
}

// 冒烟检查源集：依赖主源集的输出，只用于 runSmokeClient，不进入发布 JAR。
sourceSets {
    smoke {
        java.srcDir 'src/smoke/java'
        resources.srcDir 'src/smoke/resources'
    }
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        // 按 smokeOnly 选择场景；完整资源与系统巡检须显式设置 smokeAll=true。
        smokeClient {
            client()
            gameDirectory.set(smokeGameDirectory)
            disableIdeRun()
            systemProperty 'yvanchuxiuzhen.smoke', smokeOutputDirectory.get().asFile.absolutePath
            systemProperty 'yvanchuxiuzhen.exportRegistries', (isolatedSmoke ? smokeOutputDirectory.map { it.dir('registry-export') } : layout.buildDirectory.dir('registry-export')).get().asFile.absolutePath
            def smokeMaxHeap = providers.gradleProperty('smokeMaxHeap').getOrElse('')
            if (!smokeMaxHeap.isEmpty()) {
                if (!(smokeMaxHeap ==~ /\d+[kKmMgG]/)) {
                    throw new GradleException('smokeMaxHeap must be a heap size such as 768m or 1G')
                }
                jvmArgument "-Xmx${smokeMaxHeap}"
            }
            // -PheavyStructures=true 时连 24 MB 的 difujiegou 一起加载，用于测量旧结构的升级耗时。
            systemProperty 'yvanchuxiuzhen.smoke.heavy', providers.gradleProperty('heavyStructures').getOrElse('false')
            // -PsmokeOnly=relation,attribute 时进入世界后只做所列系统的检查。
            systemProperty 'yvanchuxiuzhen.smoke.only', providers.gradleProperty('smokeOnly').getOrElse('')
        }
        server {
            server()
            programArgument '--nogui'
            // 启动完成后导出本 Mod 的方块与物品 ID，供 tools/porting/check_ledger.py 与台账比对。
            systemProperty 'yvanchuxiuzhen.exportRegistries', layout.buildDirectory.dir('registry-export').get().asFile.absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        yvanchuxiuzhen_smoke {
            sourceSet(sourceSets.smoke)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.smoke)

// 自动化检查与测试维度只在 smokeClient 中加载。
neoForge.runs.configureEach {
    if (name != 'smokeClient') {
        loadedMods.set([neoForge.mods.getByName(project.mod_id)])
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    smokeImplementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    smokeImplementation sourceSets.main.output
    testImplementation "com.tngtech.archunit:archunit:${archunit_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxParallelForks = 1
    maxHeapSize = '512m'
}

// 未选择场景时阻止启动客户端，避免意外执行全部方块和系统巡检。
tasks.named('runSmokeClient') {
    if (isolatedSmoke) notCompatibleWithConfigurationCache('隔离场景每次必须使用新的存档与证据目录')
    def selectedChecks = providers.gradleProperty('smokeOnly').getOrElse('').trim()
    def fullInspection = providers.gradleProperty('smokeAll').getOrElse('false').toBoolean()
    def smokeFmlConfig = smokeGameDirectory.file('config/fml.toml').asFile
    def alloyFixturePath = providers.gradleProperty('alloyFixture').getOrElse('')
    doFirst {
        if (selectedChecks.isEmpty() && !fullInspection) {
            throw new GradleException('请选择 -PsmokeOnly=<场景>；完整巡检需显式设置 -PsmokeAll=true')
        }
        if (!selectedChecks.isEmpty() && fullInspection) {
            throw new GradleException('smokeOnly 与 smokeAll=true 只能选择一项')
        }
        if (selectedChecks.split(',').collect { it.trim() }.contains('jadepickupsave') && !jadePickupRun) {
            throw new GradleException('jadepickupsave 必须单独运行，以隔离存档和证据')
        }
        if (selectedChecks.split(',').collect { it.trim() }.contains('naturalalloyrepair') && !alloyRun) {
            throw new GradleException('naturalalloyrepair 必须单独运行，以隔离存档和证据')
        }
        if (alloyRun && alloyFixturePath.isEmpty()) {
            throw new GradleException('naturalalloyrepair 需要 -PalloyFixture=<未使用过的固定存档副本路径>')
        }
        if (isolatedSmoke) {
            def gameDir = smokeGameDirectory.asFile
            if (!gameDir.mkdirs() && !gameDir.isDirectory()) {
                throw new GradleException("无法创建隔离场景目录：${gameDir}")
            }
            def optionsFile = new File(gameDir, 'options.txt')
            if (!optionsFile.createNewFile()) {
                throw new GradleException("隔离场景配置已存在，拒绝覆盖：${optionsFile}")
            }
            optionsFile.setText('soundCategory_master:0.0\nrenderDistance:2\nsimulationDistance:5\nlang:zh_cn\n', 'UTF-8')
            logger.lifecycle("隔离场景游戏目录：${gameDir.absolutePath}")
            logger.lifecycle("隔离场景报告目录：${smokeOutputDirectory.get().asFile.absolutePath}")
            logger.lifecycle('隔离场景启动配置：静音，视距2，模拟距离5，中文')
        }
        if (alloyRun) {
            def fixture = file(alloyFixturePath)
            if (!fixture.isDirectory() || new File(fixture, 'session.lock').exists()) {
                throw new GradleException("天然合金需要未打开的存档副本：${fixture}")
            }
            def save = smokeGameDirectory.dir('saves/Renjian-Alloy-268-275').asFile
            if (save.exists()) throw new GradleException("拒绝覆盖天然合金存档：${save}")
            copy { from fixture; into save }
            logger.lifecycle("天然合金只读来源副本：${fixture.absolutePath}")
        }
        // FML 启动画面早于冒烟 Mixin，必须在启动进程前关闭。
        if (!smokeFmlConfig.exists()) {
            smokeFmlConfig.parentFile.mkdirs()
            smokeFmlConfig.setText('earlyWindowControl = false\n', 'UTF-8')
        }
        def earlyWindowSettings = smokeFmlConfig.readLines('UTF-8').takeWhile { !it.stripLeading().startsWith('[') }.findAll {
            it ==~ /\s*earlyWindowControl\s*=.*/
        }
        if (earlyWindowSettings.size() != 1 || !(earlyWindowSettings[0] ==~ /\s*earlyWindowControl\s*=\s*false\s*(#.*)?/)) {
            throw new GradleException("后台客户端要求 ${smokeFmlConfig} 的 earlyWindowControl = false")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 由 src/main/templates 展开 Mod 元数据；版本与 ID 只在 gradle.properties 维护。
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [minecraft_version_range: minecraft_version_range,
                             neo_version_range      : neo_version_range,
                             geckolib_version_range : geckolib_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_license            : mod_license,
                             mod_version            : mod_version]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

/**
 * 合并按单位拆分的语言与声音片段，使各系统并行修改时不在同一个大文件上冲突：
 * src/main/lang/<语言>/<单位>.json → assets/<命名空间>/lang/<语言>.json，
 * src/main/sounds/<单位>.json → assets/<命名空间>/sounds.json；命名空间即 Mod ID。
 * 同一片段内或不同片段之间出现重复键时构建失败。
 */
abstract class MergeAssetFragments extends DefaultTask {
    @Input
    abstract Property<String> getNamespace()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getFragments()

    @Internal
    abstract DirectoryProperty getLangRoot()

    @Internal
    abstract DirectoryProperty getSoundRoot()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void merge() {
        File out = outputDir.get().asFile
        out.deleteDir()
        String assets = "assets/${namespace.get()}"
        Map<String, Map<String, Object>> merged = new TreeMap<>()
        Map<String, File> origins = [:]
        collect(langRoot.get().asFile, 2, merged, origins) { List<String> parts -> "${assets}/lang/${parts[0]}.json" }
        collect(soundRoot.get().asFile, 1, merged, origins) { List<String> parts -> "${assets}/sounds.json" }
        merged.each { String target, Map<String, Object> entries ->
            File file = new File(out, target)
            file.parentFile.mkdirs()
            file.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries)) + '\n', 'UTF-8')
        }
    }

    private static void collect(File root, int depth, Map<String, Map<String, Object>> merged, Map<String, File> origins, Closure<String> target) {
        if (!root.directory) {
            return
        }
        List<File> files = []
        root.eachFileRecurse(groovy.io.FileType.FILES) { files << it }
        files.sort { it.path }.each { File file ->
            List<String> parts = root.toPath().relativize(file.toPath()).iterator().collect { it.toString() }
            if (parts.size() != depth || !file.name.endsWith('.json')) {
                throw new GradleException("片段路径不符合约定：${file}")
            }
            String text = file.getText('UTF-8')
            Set<String> seen = new HashSet<>()
            String repeated = topLevelKeys(text).find { key -> !seen.add(key) }
            if (repeated != null) {
                throw new GradleException("片段内重复键 ${repeated}：${file}")
            }
            Map<String, Object> parsed
            try {
                parsed = new groovy.json.JsonSlurper().parseText(text) as Map<String, Object>
            } catch (groovy.json.JsonException e) {
                throw new GradleException("片段不是有效的 JSON 对象：${file}", e)
            }
            Map<String, Object> entries = merged.computeIfAbsent(target(parts)) { new LinkedHashMap<>() }
            parsed.each { String key, Object value ->
                String id = target(parts) + '#' + key
                if (origins.containsKey(id)) {
                    throw new GradleException("重复键 ${key}：${origins[id]} 与 ${file}")
                }
                origins[id] = file
                entries[key] = value
            }
        }
    }

    /** 按出现顺序返回顶层对象的键（原文，不解转义），用于发现 JsonSlurper 会静默覆盖的同文件重复键。 */
    private static List<String> topLevelKeys(String text) {
        List<String> keys = []
        int depth = 0
        int start = -1
        boolean inString = false
        for (int i = 0; i < text.length(); i++) {
            char c = text.charAt(i)
            if (inString) {
                if (c == '\\' as char) {
                    i++
                } else if (c == '"' as char) {
                    inString = false
                    int next = i + 1
                    while (next < text.length() && Character.isWhitespace(text.charAt(next))) {
                        next++
                    }
                    if (depth == 1 && next < text.length() && text.charAt(next) == ':' as char) {
                        keys << text.substring(start + 1, i)
                    }
                }
            } else if (c == '"' as char) {
                inString = true
                start = i
            } else if (c == '{' as char || c == '[' as char) {
                depth++
            } else if (c == '}' as char || c == ']' as char) {
                depth--
            }
        }
        return keys
    }
}

def mergeAssetFragments = tasks.register('mergeAssetFragments', MergeAssetFragments) {
    namespace = mod_id
    fragments.from('src/main/lang', 'src/main/sounds')
    langRoot = layout.projectDirectory.dir('src/main/lang')
    soundRoot = layout.projectDirectory.dir('src/main/sounds')
    outputDir = layout.buildDirectory.dir('generated/assetFragments')
}
sourceSets.main.resources.srcDir mergeAssetFragments
neoForge.ideSyncTask mergeAssetFragments

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named("processSmokeResources") { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
